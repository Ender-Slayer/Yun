<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* ========== 整体容器，约束水平范围 ========== */
        .wrapper {
            width: 100%;
            max-width: 520px;
            position: relative;
            padding-top: 80px;
        }

        /* ========== 左上角标题，不超出 wrapper ========== */
        .header {
            position: absolute;
            top: 24px;
            left: 0;
            z-index: 10;
        }
        .title {
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .title:hover { transform: scale(1.15); }
        .title:active { transform: scale(1.4); }

        /* ========== 播放按钮，不超出 wrapper ========== */
        .play-btn {
            position: absolute;
            top: 28px;
            right: 0;
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1e1e1e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #777;
            transition: all 0.2s;
            user-select: none;
        }
        .play-btn:hover {
            background: #2a2a2a;
            color: #ccc;
        }
        .play-btn.playing {
            background: #2a2a2a;
            color: #ccc;
        }

        /* ========== 隐藏的 iframe ========== */
        .hidden-player {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ========== 留言板 ========== */
        .message-list {
            height: 55vh;
            overflow-y: auto;
            margin-bottom: 24px;
            scroll-behavior: smooth;
            background: rgba(255,255,255,0.012);
            border-radius: 2px;
            padding: 4px 0;
            /* 微妙的顶部光晕渲染，不单调 */
            box-shadow: inset 0 20px 40px -20px rgba(255,255,255,0.015);
        }
        .message-list::-webkit-scrollbar { width: 3px; }
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
        }
        .message-list::-webkit-scrollbar-track { background: transparent; }

        .message-item {
            padding: 12px 4px;
            color: #999;
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.3s ease;
            transition: color 0.3s;
        }
        .message-item:hover {
            color: #bbb;
        }
        .message-item .time {
            font-size: 11px;
            color: #222;
            display: block;
            margin-top: 4px;
            transition: color 0.3s;
        }
        .message-item:hover .time {
            color: #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 输入区 ========== */
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 4px;
            color: #aaa;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-row input:focus {
            border-bottom-color: rgba(255,255,255,0.2);
        }
        .input-row input::placeholder { color: #222; }

        .input-row button {
            background: transparent;
            border: none;
            color: #333;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s;
            white-space: nowrap;
        }
        .input-row button:hover { color: #888; }

        /* ========== 底部状态 ========== */
        .status {
            text-align: center;
            margin-top: 16px;
            font-size: 10px;
            color: #1a1a1a;
            letter-spacing: 1px;
        }
        .status.connected { color: #060; }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- 左上角标题 -->
        <div class="header">
            <span class="title" onclick="titleBounce()" title="点我">🤪</span>
        </div>

        <!-- 播放按钮 -->
        <div class="play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">
            ▶
        </div>

        <!-- 隐藏的网易云 iframe -->
        <div class="hidden-player">
            <iframe id="musicFrame"
                    src="https://music.163.com/outchain/player?type=2&id=2161785290&auto=0&height=66"
                    width="330" height="86"
                    frameborder="no">
            </iframe>
        </div>

        <!-- 留言板 -->
        <div class="message-list" id="messageList">
            <div style="color:#1a1a1a;text-align:center;padding:60px 0;">加载中...</div>
        </div>
        <div class="input-row">
            <input type="text" id="messageInput" placeholder="说点什么..." maxlength="200" />
            <button onclick="sendMessage()">发送</button>
        </div>
        <div class="status" id="status">正在连接...</div>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyC4t7z-gj04cmuytgZpN2WiAIevNOXx60w",
            authDomain: "project-99373354443591401.firebaseapp.com",
            databaseURL: "https://project-99373354443591401-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "project-99373354443591401",
            storageBucket: "project-99373354443591401.firebasestorage.app",
            messagingSenderId: "255729708739",
            appId: "1:255729708739:web:debf265e4e3dccc689fc76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        const statusEl = document.getElementById('status');

        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messages = data ? Object.values(data) : [];
            messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            renderMessages(messages);
            statusEl.textContent = '已连接';
            statusEl.className = 'status connected';
        }, () => {
            statusEl.textContent = '连接失败';
            statusEl.className = 'status';
        });

        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            push(messagesRef, {
                text: text,
                time: new Date().toLocaleString('zh-CN'),
                timestamp: Date.now()
            });
            input.value = '';
            input.focus();
        };

        function renderMessages(messages) {
            const list = document.getElementById('messageList');
            if (messages.length === 0) {
                list.innerHTML = '<div style="color:#1a1a1a;text-align:center;padding:60px 0;">还没有留言，来做第一个 🎈</div>';
                return;
            }
            list.innerHTML = messages.slice().reverse().map(msg => `
                <div class="message-item">
                    ${escapeHtml(msg.text)}
                    <span class="time">${msg.time || ''}</span>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.isPlaying = false;
        window.togglePlay = function() {
            const btn = document.getElementById('playBtn');
            const iframe = document.getElementById('musicFrame');
            if (window.isPlaying) {
                iframe.src = iframe.src;
                window.isPlaying = false;
                btn.textContent = '▶';
                btn.classList.remove('playing');
            } else {
                iframe.src = 'https://music.163.com/outchain/player?type=2&id=2161785290&auto=1&height=66';
                window.isPlaying = true;
                btn.textContent = '⏸';
                btn.classList.add('playing');
            }
        };

        window.titleBounce = function() {
            const title = document.querySelector('.title');
            const rots = ['rotate(15deg)', 'rotate(-15deg)', 'rotate(25deg)', 'rotate(-25deg)', 'rotate(0deg)'];
            title.style.transform = rots[Math.floor(Math.random() * rots.length)];
            setTimeout(() => { title.style.transform = ''; }, 300);
        };

        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') window.sendMessage();
        });
    </script>
</body>
</html>
