<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 520px;
            position: relative;
            padding-top: 80px;
        }

        .header {
            position: absolute;
            top: 24px;
            left: 0;
            z-index: 10;
        }
        .title {
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .title:hover { transform: scale(1.15); }
        .title:active { transform: scale(1.4); }

        /* 播放按钮 */
        .play-btn {
            position: absolute;
            top: 28px;
            right: 0;
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1e1e1e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }
        .play-btn:hover {
            background: #2a2a2a;
        }
        .play-btn.playing {
            background: #2a2a2a;
        }

        /* 播放图标：三角形 */
        .play-icon {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 14px solid #777;
            margin-left: 3px;
            transition: border-color 0.2s;
        }
        .play-btn:hover .play-icon {
            border-left-color: #ccc;
        }
        .play-btn.playing .play-icon {
            border-left-color: #ccc;
        }

        /* 暂停图标：两条竖线 */
        .pause-icon {
            display: flex;
            gap: 5px;
        }
        .pause-bar {
            width: 4px;
            height: 14px;
            background: #777;
            border-radius: 1px;
            transition: background 0.2s;
        }
        .play-btn:hover .pause-bar {
            background: #ccc;
        }
        .play-btn.playing .pause-bar {
            background: #ccc;
        }

        .message-list {
            height: 55vh;
            overflow-y: auto;
            margin-bottom: 24px;
            scroll-behavior: smooth;
            background: rgba(255,255,255,0.012);
            border-radius: 2px;
            padding: 4px 0;
            box-shadow: inset 0 20px 40px -20px rgba(255,255,255,0.015);
        }
        .message-list::-webkit-scrollbar { width: 3px; }
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
        }
        .message-list::-webkit-scrollbar-track { background: transparent; }

        .message-item {
            padding: 12px 4px;
            color: #999;
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.3s ease;
            transition: color 0.3s;
        }
        .message-item:hover { color: #bbb; }
        .message-item .time {
            font-size: 11px;
            color: #222;
            display: block;
            margin-top: 4px;
            transition: color 0.3s;
        }
        .message-item:hover .time { color: #333; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 4px;
            color: #aaa;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-row input:focus {
            border-bottom-color: rgba(255,255,255,0.2);
        }
        .input-row input::placeholder { color: #222; }

        .input-row button {
            background: transparent;
            border: none;
            color: #333;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s;
            white-space: nowrap;
        }
        .input-row button:hover { color: #888; }

        .status {
            text-align: center;
            margin-top: 16px;
            font-size: 10px;
            color: #1a1a1a;
            letter-spacing: 1px;
        }
        .status.connected { color: #060; }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="header">
            <span class="title" onclick="titleBounce()" title="点我">🤪</span>
        </div>

        <!-- 播放按钮 -->
        <div class="play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">
            <div class="play-icon" id="playIcon"></div>
            <div class="pause-icon" id="pauseIcon" style="display: none;">
                <div class="pause-bar"></div>
                <div class="pause-bar"></div>
            </div>
        </div>

        <!-- 本地音频 -->
        <audio id="bgm" src="Pepper.mp3" preload="auto"></audio>

        <div class="message-list" id="messageList">
            <div style="color:#1a1a1a;text-align:center;padding:60px 0;">加载中...</div>
        </div>
        <div class="input-row">
            <input type="text" id="messageInput" placeholder="说点什么..." maxlength="200" />
            <button onclick="sendMessage()">发送</button>
        </div>
        <div class="status" id="status">正在连接...</div>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyC4t7z-gj04cmuytgZpN2WiAIevNOXx60w",
            authDomain: "project-99373354443591401.firebaseapp.com",
            databaseURL: "https://project-99373354443591401-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "project-99373354443591401",
            storageBucket: "project-99373354443591401.firebasestorage.app",
            messagingSenderId: "255729708739",
            appId: "1:255729708739:web:debf265e4e3dccc689fc76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        const statusEl = document.getElementById('status');

        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messages = data ? Object.values(data) : [];
            messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            renderMessages(messages);
            statusEl.textContent = '已连接';
            statusEl.className = 'status connected';
        }, () => {
            statusEl.textContent = '连接失败';
            statusEl.className = 'status';
        });

        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            push(messagesRef, {
                text: text,
                time: new Date().toLocaleString('zh-CN'),
                timestamp: Date.now()
            });
            input.value = '';
            input.focus();
        };

        function renderMessages(messages) {
            const list = document.getElementById('messageList');
            if (messages.length === 0) {
                list.innerHTML = '<div style="color:#1a1a1a;text-align:center;padding:60px 0;">暂无留言</div>';
                return;
            }
            list.innerHTML = messages.slice().reverse().map(msg => `
                <div class="message-item">
                    ${escapeHtml(msg.text)}
                    <span class="time">${msg.time || ''}</span>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 本地音频控制 ====================
        const bgm = document.getElementById('bgm');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        window.togglePlay = function() {
            if (bgm.paused) {
                bgm.play();
                playBtn.classList.add('playing');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'flex';
            } else {
                bgm.pause();
                playBtn.classList.remove('playing');
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        };

        // 播放结束自动切回播放图标
        bgm.addEventListener('ended', function() {
            playBtn.classList.remove('playing');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        });

        // 加载失败提示
        bgm.addEventListener('error', function() {
            console.log('音乐文件加载失败，请确认 music.mp3 在同一个目录下');
        });

        window.titleBounce = function() {
            const title = document.querySelector('.title');
            const rots = ['rotate(15deg)', 'rotate(-15deg)', 'rotate(25deg)', 'rotate(-25deg)', 'rotate(0deg)'];
            title.style.transform = rots[Math.floor(Math.random() * rots.length)];
            setTimeout(() => { title.style.transform = ''; }, 300);
        };

        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') window.sendMessage();
        });
    </script>
</body>
</html>
