<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 520px;
            position: relative;
            padding-top: 80px;
            padding-bottom: 40px;
        }

        .header {
            position: absolute;
            top: 24px;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .title {
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.2s;
            line-height: 1;
        }
        .title:hover { transform: scale(1.15); }
        .title:active { transform: scale(1.4); }

        /* 模式切换按钮 */
        .mode-tabs {
            display: flex;
            gap: 6px;
        }
        .mode-tab {
            background: transparent;
            border: none;
            color: #555;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 18px;
            letter-spacing: 1px;
            transition: color 0.3s;
            font-family: inherit;
            line-height: 1;
        }
        .mode-tab:hover { color: #999; }
        .mode-tab.active { color: #ccc; }

        /* 播放按钮 */
        .play-btn {
            position: absolute;
            top: 28px;
            right: 0;
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1e1e1e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }
        .play-btn:hover {
            background: #2a2a2a;
        }
        .play-btn.playing {
            background: #2a2a2a;
        }

        /* 播放图标：三角形 */
        .play-icon {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 14px solid #777;
            margin-left: 3px;
            transition: border-color 0.2s;
        }
        .play-btn:hover .play-icon {
            border-left-color: #ccc;
        }
        .play-btn.playing .play-icon {
            border-left-color: #ccc;
        }

        /* 暂停图标：两条竖线 */
        .pause-icon {
            display: flex;
            gap: 5px;
        }
        .pause-bar {
            width: 4px;
            height: 14px;
            background: #777;
            border-radius: 1px;
            transition: background 0.2s;
        }
        .play-btn:hover .pause-bar {
            background: #ccc;
        }
        .play-btn.playing .pause-bar {
            background: #ccc;
        }

        /* 内容区域 */
        .content-area {
            min-height: 55vh;
            overflow-y: auto;
            margin-bottom: 24px;
            scroll-behavior: smooth;
            background: rgba(255,255,255,0.012);
            border-radius: 2px;
            padding: 4px 0;
            box-shadow: inset 0 20px 40px -20px rgba(255,255,255,0.015);
        }
        .content-area::-webkit-scrollbar { width: 3px; }
        .content-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
        }
        .content-area::-webkit-scrollbar-track { background: transparent; }

        /* 留言板 */
        .message-board { display: block; }
        .memo-board { display: none; }

        .message-item {
            padding: 10px 12px;
            color: #999;
            font-size: 13px;
            line-height: 1.7;
            word-break: break-word;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.3s ease;
            transition: color 0.3s;
        }
        .message-item:hover { color: #bbb; }
        .message-item .time {
            font-size: 11px;
            color: #555;
            display: block;
            margin-top: 4px;
            transition: color 0.3s;
        }
        .message-item:hover .time { color: #777; }

        /* 备忘录条目 */
        .memo-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            color: #999;
            font-size: 13px;
            line-height: 1.7;
            word-break: break-word;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.3s ease;
            transition: color 0.3s;
        }
        .memo-item:hover { color: #bbb; }
        .memo-text {
            flex: 1;
            cursor: pointer;
            user-select: text;
        }
        .memo-text .copy-feedback {
            color: #4ade80;
            font-size: 12px;
            margin-left: 6px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .memo-text .copy-feedback.show {
            opacity: 1;
        }
        .memo-delete {
            background: transparent;
            border: none;
            color: #444;
            cursor: pointer;
            font-size: 16px;
            padding: 2 6px;
            transition: color 0.3s;
            flex-shrink: 0;
            line-height: 1.7;
        }
        .memo-delete:hover { color: #c44; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 输入区 */
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 4px;
            color: #aaa;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-row input:focus {
            border-bottom-color: rgba(255,255,255,0.2);
        }
        .input-row input::placeholder { color: #444; }

        .input-row button {
            background: transparent;
            border: none;
            color: #555;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.3s;
            white-space: nowrap;
            font-family: inherit;
        }
        .input-row button:hover { color: #999; }

        /* 底部 */
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 10px;
            color: #1a1a1a;
            letter-spacing: 1px;
        }
        .status.connected { color: #060; }

        .electricity-cost {
            text-align: center;
            margin-top: 8px;
            font-size: 10px;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="header">
            <span class="title" onclick="titleBounce()" title="点我">🤪</span>
            <div class="mode-tabs">
                <button class="mode-tab active" id="tabMessage" onclick="switchMode('message')">留言</button>
                <button class="mode-tab" id="tabMemo" onclick="switchMode('memo')">便签</button>
            </div>
        </div>

        <!-- 播放按钮 -->
        <div class="play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">
            <div class="play-icon" id="playIcon"></div>
            <div class="pause-icon" id="pauseIcon" style="display: none;">
                <div class="pause-bar"></div>
                <div class="pause-bar"></div>
            </div>
        </div>

        <!-- 本地音频 -->
        <audio id="bgm" src="pepper.mp3" preload="auto"></audio>

        <!-- 留言板 -->
        <div class="content-area message-board" id="messageBoard">
            <div style="color:#444;text-align:center;padding:60px 0;font-size:13px;">暂无留言</div>
        </div>

        <!-- 备忘录 -->
        <div class="content-area memo-board" id="memoBoard">
            <div style="color:#444;text-align:center;padding:60px 0;font-size:13px;">暂无便签</div>
        </div>

        <!-- 输入区 -->
        <div class="input-row" id="inputRow">
            <input type="text" id="messageInput" placeholder="说点什么..." maxlength="500" />
            <button id="sendBtn" onclick="sendItem()">发送</button>
        </div>

        <div class="status" id="status">正在连接...</div>
        <div class="electricity-cost" id="electricityCost">本网页已产生 ¥0.000000 电费</div>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyC4t7z-gj04cmuytgZpN2WiAIevNOXx60w",
            authDomain: "project-99373354443591401.firebaseapp.com",
            databaseURL: "https://project-99373354443591401-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "project-99373354443591401",
            storageBucket: "project-99373354443591401.firebasestorage.app",
            messagingSenderId: "255729708739",
            appId: "1:255729708739:web:debf265e4e3dccc689fc76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');
        const memosRef = ref(db, 'memos');

        const statusEl = document.getElementById('status');
        let currentMode = 'message';

        // ==================== 实时监听留言 ====================
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messages = data ? Object.values(data) : [];
            messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            renderMessages(messages);
            statusEl.textContent = '已连接';
            statusEl.className = 'status connected';
        }, () => {
            statusEl.textContent = '连接失败';
            statusEl.className = 'status';
        });

        // ==================== 实时监听备忘录 ====================
        onValue(memosRef, (snapshot) => {
            const data = snapshot.val();
            const memos = data ? Object.entries(data).map(([key, val]) => ({ key, ...val })) : [];
            memos.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            renderMemos(memos);
        });

        // ==================== 渲染留言 ====================
        function renderMessages(messages) {
            const list = document.getElementById('messageBoard');
            if (messages.length === 0) {
                list.innerHTML = '<div style="color:#444;text-align:center;padding:60px 0;font-size:13px;">还没有留言，来做第一个吧</div>';
                return;
            }
            list.innerHTML = messages.slice().reverse().map(msg => `
                <div class="message-item">
                    ${escapeHtml(msg.text)}
                    <span class="time">${msg.time || ''}</span>
                </div>
            `).join('');
        }

        // ==================== 渲染备忘录 ====================
        function renderMemos(memos) {
            const list = document.getElementById('memoBoard');
            if (memos.length === 0) {
                list.innerHTML = '<div style="color:#444;text-align:center;padding:60px 0;font-size:13px;">还没有备忘录，记点什么吧</div>';
                return;
            }
            list.innerHTML = memos.map(memo => `
                <div class="memo-item">
                    <span class="memo-text" title="点击复制">${escapeHtml(memo.text)}<span class="copy-feedback">已复制！</span></span>
                    <button class="memo-delete" data-key="${memo.key}" title="删除">×</button>
                </div>
            `).join('');

            // 绑定点击复制
            list.querySelectorAll('.memo-text').forEach(el => {
                el.addEventListener('click', function() {
                    const feedback = this.querySelector('.copy-feedback');
                    const text = this.textContent.replace('已复制！', '').trim();
                    
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(() => {
                            feedback.classList.add('show');
                            setTimeout(() => { feedback.classList.remove('show'); }, 1500);
                        }).catch(() => {
                            fallbackCopy(feedback, text);
                        });
                    } else {
                        fallbackCopy(feedback, text);
                    }
                });
            });

            // 绑定删除按钮
            list.querySelectorAll('.memo-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const key = this.getAttribute('data-key');
                    remove(ref(db, 'memos/' + key));
                });
            });
        }

        function fallbackCopy(feedback, text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                feedback.classList.add('show');
                setTimeout(() => { feedback.classList.remove('show'); }, 1500);
            } catch (e) {}
            document.body.removeChild(textarea);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 发送 ====================
        window.sendItem = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (currentMode === 'message') {
                push(messagesRef, {
                    text: text,
                    time: new Date().toLocaleString('zh-CN'),
                    timestamp: Date.now()
                });
            } else {
                push(memosRef, {
                    text: text,
                    timestamp: Date.now()
                });
            }

            input.value = '';
            input.focus();
        };

        // ==================== 模式切换 ====================
        window.switchMode = function(mode) {
            currentMode = mode;
            const tabMsg = document.getElementById('tabMessage');
            const tabMemo = document.getElementById('tabMemo');
            const boardMsg = document.getElementById('messageBoard');
            const boardMemo = document.getElementById('memoBoard');
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            if (mode === 'message') {
                tabMsg.classList.add('active');
                tabMemo.classList.remove('active');
                boardMsg.style.display = 'block';
                boardMemo.style.display = 'none';
                input.placeholder = '说点什么...';
                sendBtn.textContent = '发送';
            } else {
                tabMemo.classList.add('active');
                tabMsg.classList.remove('active');
                boardMemo.style.display = 'block';
                boardMsg.style.display = 'none';
                input.placeholder = '记点什么...';
                sendBtn.textContent = '添加';
            }
        };

        // ==================== 音频控制 ====================
        const bgm = document.getElementById('bgm');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        window.togglePlay = function() {
            if (bgm.paused) {
                bgm.play();
                playBtn.classList.add('playing');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'flex';
            } else {
                bgm.pause();
                playBtn.classList.remove('playing');
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        };

        bgm.addEventListener('ended', function() {
            playBtn.classList.remove('playing');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        });

        // ==================== 电费计数器 ====================
        const costEl = document.getElementById('electricityCost');
        const startTime = Date.now();
        const wattsPerSecond = 0.00000012;

        setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            const cost = elapsed * wattsPerSecond;
            costEl.textContent = `本网页已产生 ¥${cost.toFixed(6)} 电费`;
        }, 1000);

        // ==================== 彩蛋 ====================
        window.titleBounce = function() {
            const title = document.querySelector('.title');
            const rots = ['rotate(15deg)', 'rotate(-15deg)', 'rotate(25deg)', 'rotate(-25deg)', 'rotate(0deg)'];
            title.style.transform = rots[Math.floor(Math.random() * rots.length)];
            setTimeout(() => { title.style.transform = ''; }, 300);
        };

        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') window.sendItem();
        });
    </script>
</body>
</html>
