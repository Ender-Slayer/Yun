<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便签·留言</title>
    <link rel="icon" href="Favicon.png" type="image/png">
    <!-- 加载 Poppins 与 Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            min-height: 100vh;
            font-family: 'Poppins', "Noto Sans SC", "等线", "DengXian", sans-serif;
            font-size: 18px;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 560px;
            position: relative;
            padding-top: 70px;
            padding-bottom: 40px;
        }

        /* 头部：只保留模式切换，去掉标题文字 */
        .header {
            position: absolute;
            top: 24px;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: center;
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-left: 0; /* 确保紧贴左侧 */
        }

        .mode-tab {
            background: transparent;
            border: none;
            color: #666;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.2s;
            font-family: inherit;
            line-height: 1.4;
        }
        .mode-tab:hover { color: #aaa; }
        .mode-tab.active {
            color: #eee;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
        }

        .content-area {
            min-height: 50vh;
            overflow-y: auto;
            margin-bottom: 28px;
            scroll-behavior: smooth;
            background: rgba(255, 255, 255, 0.012);
            border-radius: 2px;
            padding: 6px 0;
            box-shadow: inset 0 20px 40px -20px rgba(255,255,255,0.015);
        }
        .content-area::-webkit-scrollbar { width: 4px; }
        .content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
        }
        .content-area::-webkit-scrollbar-track { background: transparent; }

        .message-board { display: none; }
        .memo-board { display: block; }

        .message-item {
            padding: 14px 16px;
            color: #bbb;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-word;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            animation: fadeIn 0.25s ease;
            transition: color 0.2s;
        }
        .message-item:hover { color: #ddd; }
        .message-item .time {
            font-size: 15px;
            color: #555;
            display: block;
            margin-top: 6px;
            transition: color 0.2s;
        }
        .message-item:hover .time { color: #777; }

        .memo-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 16px;
            color: #bbb;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-word;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            animation: fadeIn 0.25s ease;
            transition: color 0.2s;
        }
        .memo-item:hover { color: #ddd; }
        .memo-text {
            flex: 1;
            cursor: pointer;
            user-select: text;
        }
        .memo-text .copy-feedback {
            color: #6ee7b7;
            font-size: 16px;
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        .memo-text .copy-feedback.show { opacity: 1; }

        .memo-delete {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 22px;
            padding: 2px 8px;
            transition: color 0.2s;
            flex-shrink: 0;
            line-height: 1.6;
        }
        .memo-delete:hover { color: #d66; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 6px;
            color: #ccc;
            font-size: 18px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-row input:focus {
            border-bottom-color: rgba(255, 255, 255, 0.25);
        }
        .input-row input::placeholder { color: #4a4a4a; }

        .input-row button {
            background: transparent;
            border: none;
            color: #666;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        .input-row button:hover { color: #bbb; }

        .status {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #1a1a1a;
            letter-spacing: 0.5px;
        }
        .status.connected { color: #0a5; }

        .electricity-cost {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
            color: #444;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- 头部：只保留模式切换标签，无标题文字 -->
    <div class="header">
        <div class="mode-tabs">
            <button class="mode-tab" id="tabMemo" onclick="switchMode('memo')">便签</button>
            <button class="mode-tab" id="tabMessage" onclick="switchMode('message')">留言</button>
        </div>
    </div>

    <!-- 留言板 -->
    <div class="content-area message-board" id="messageBoard">
        <div style="color:#444;text-align:center;padding:70px 0;font-size:18px;">暂无留言</div>
    </div>

    <!-- 便签板 -->
    <div class="content-area memo-board" id="memoBoard">
        <div style="color:#444;text-align:center;padding:70px 0;font-size:18px;">暂无便签</div>
    </div>

    <div class="input-row" id="inputRow">
        <input type="text" id="messageInput" placeholder="记点什么..." maxlength="500" />
        <button id="sendBtn" onclick="sendItem()">添加</button>
    </div>

    <div class="status" id="status">正在连接...</div>
    <div class="electricity-cost" id="electricityCost">本网页已产生 ¥0.000000 电费</div>

</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, push, onValue, remove, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyC4t7z-gj04cmuytgZpN2WiAIevNOXx60w",
        authDomain: "project-99373354443591401.firebaseapp.com",
        databaseURL: "https://project-99373354443591401-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "project-99373354443591401",
        storageBucket: "project-99373354443591401.firebasestorage.app",
        messagingSenderId: "255729708739",
        appId: "1:255729708739:web:debf265e4e3dccc689fc76"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const memosRef = ref(db, 'memos');
    const electricityRef = ref(db, 'electricity/total');

    const statusEl = document.getElementById('status');
    let currentMode = 'memo';

    onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        const messages = data ? Object.values(data) : [];
        messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        renderMessages(messages);
        statusEl.textContent = '已连接';
        statusEl.className = 'status connected';
    }, () => {
        statusEl.textContent = '连接失败';
        statusEl.className = 'status';
    });

    onValue(memosRef, (snapshot) => {
        const data = snapshot.val();
        const memos = data ? Object.entries(data).map(([key, val]) => ({ key, ...val })) : [];
        memos.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        renderMemos(memos);
    });

    function renderMessages(messages) {
        const list = document.getElementById('messageBoard');
        if (messages.length === 0) {
            list.innerHTML = '<div style="color:#444;text-align:center;padding:70px 0;font-size:18px;">还没有留言，来做第一个吧</div>';
            return;
        }
        list.innerHTML = messages.slice().reverse().map(msg => `
            <div class="message-item">
                ${escapeHtml(msg.text)}
                <span class="time">${msg.time || ''}</span>
            </div>
        `).join('');
    }

    function renderMemos(memos) {
        const list = document.getElementById('memoBoard');
        if (memos.length === 0) {
            list.innerHTML = '<div style="color:#444;text-align:center;padding:70px 0;font-size:18px;">还没有便签，记点什么吧</div>';
            return;
        }
        list.innerHTML = memos.map(memo => `
            <div class="memo-item">
                <span class="memo-text" title="点击复制">${escapeHtml(memo.text)}<span class="copy-feedback">已复制！</span></span>
                <button class="memo-delete" data-key="${memo.key}" title="删除">×</button>
            </div>
        `).join('');

        list.querySelectorAll('.memo-text').forEach(el => {
            el.addEventListener('click', function() {
                const feedback = this.querySelector('.copy-feedback');
                const text = this.textContent.replace('已复制！', '').trim();
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        feedback.classList.add('show');
                        setTimeout(() => { feedback.classList.remove('show'); }, 1500);
                    }).catch(() => {
                        fallbackCopy(feedback, text);
                    });
                } else {
                    fallbackCopy(feedback, text);
                }
            });
        });

        list.querySelectorAll('.memo-delete').forEach(btn => {
            btn.addEventListener('click', function() {
                const key = this.getAttribute('data-key');
                remove(ref(db, 'memos/' + key));
            });
        });
    }

    function fallbackCopy(feedback, text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            feedback.classList.add('show');
            setTimeout(() => { feedback.classList.remove('show'); }, 1500);
        } catch (e) {}
        document.body.removeChild(textarea);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    window.sendItem = function() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        if (currentMode === 'message') {
            push(messagesRef, {
                text: text,
                time: new Date().toLocaleString('zh-CN'),
                timestamp: Date.now()
            });
        } else {
            push(memosRef, {
                text: text,
                timestamp: Date.now()
            });
        }
        input.value = '';
        input.focus();
    };

    window.switchMode = function(mode) {
        currentMode = mode;
        const tabMsg = document.getElementById('tabMessage');
        const tabMemo = document.getElementById('tabMemo');
        const boardMsg = document.getElementById('messageBoard');
        const boardMemo = document.getElementById('memoBoard');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        if (mode === 'message') {
            tabMsg.classList.add('active');
            tabMemo.classList.remove('active');
            boardMsg.style.display = 'block';
            boardMemo.style.display = 'none';
            input.placeholder = '说点什么...';
            sendBtn.textContent = '发送';
        } else {
            tabMemo.classList.add('active');
            tabMsg.classList.remove('active');
            boardMemo.style.display = 'block';
            boardMsg.style.display = 'none';
            input.placeholder = '记点什么...';
            sendBtn.textContent = '添加';
        }
    };

    // 默认激活便签
    document.getElementById('tabMemo').classList.add('active');
    document.getElementById('tabMessage').classList.remove('active');
    document.getElementById('messageBoard').style.display = 'none';
    document.getElementById('memoBoard').style.display = 'block';

    // 电费计数器
    const costEl = document.getElementById('electricityCost');
    const wattsPerSecond = 0.00000012;
    let cloudTotal = 0;
    let localStartTime = Date.now();

    onValue(electricityRef, (snapshot) => {
        const data = snapshot.val();
        cloudTotal = data || 0;
        costEl.textContent = `本网页已产生 ¥${cloudTotal.toFixed(6)} 电费`;
    });

    setInterval(() => {
        const elapsed = (Date.now() - localStartTime) / 1000;
        const currentTotal = cloudTotal + elapsed * wattsPerSecond;
        costEl.textContent = `本网页已产生 ¥${currentTotal.toFixed(6)} 电费`;
    }, 1000);

    setInterval(() => {
        const elapsed = (Date.now() - localStartTime) / 1000;
        const increment = elapsed * wattsPerSecond;
        cloudTotal += increment;
        localStartTime = Date.now();
        set(electricityRef, cloudTotal);
    }, 30000);

    window.addEventListener('beforeunload', () => {
        const elapsed = (Date.now() - localStartTime) / 1000;
        const increment = elapsed * wattsPerSecond;
        const finalTotal = cloudTotal + increment;
        const blob = new Blob([JSON.stringify(finalTotal)], { type: 'application/json' });
        navigator.sendBeacon(
            'https://project-99373354443591401-default-rtdb.asia-southeast1.firebasedatabase.app/electricity/total.json',
            blob
        );
    });

    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') window.sendItem();
    });
</script>
</body>
</html>
